# /etc/nginx/conf.d/locallatin.conf
# LocalLatin Scholar Review — reverse proxy + static frontend

upstream locallatin_backend {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl http2;
    server_name ai.csr.uky.edu;

    ssl_certificate     /etc/ssl/certs/ai.csr.uky.edu.crt;
    ssl_certificate_key /etc/ssl/private/ai.csr.uky.edu.key;

    # FastAPI serves both /api/* and the built SPA from web/static.
    location / {
        proxy_pass http://locallatin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    server_name ai.csr.uky.edu;
    return 301 https://$host$request_uri;
}
