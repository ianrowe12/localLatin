# LocalLatin path-scoped nginx location.
#
# Merge these location blocks into the active ai.csr.uky.edu HTTPS server block.
# Do not replace the shared server's root `location /`; LocalLatin should live
# under /locallatin/ so other projects can keep using the shared hostname.

location = /locallatin {
    return 301 /locallatin/;
}

location ^~ /locallatin/ {
    # The trailing slash strips /locallatin/ before proxying, so FastAPI still
    # receives /api/* and /assets/* while public URLs stay under /locallatin/.
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /locallatin;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
