name: CI

# Pull-request gate. Everything here must pass on a clean GitHub-hosted runner:
# no conda env, no GPU, and no access to the large embedding artifacts. Both jobs
# use a sparse, blob-filtered checkout so the ~1.1 GB `runs/` tree is never
# fetched -- only the source paths the checks actually read.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 is the HPC conda env (localLatin). It covers the research code
          # in src/ only: web/models.py uses enum.StrEnum, so the webapp suite
          # cannot import on 3.10 at all.
          - python-version: "3.10"
            pytest-paths: tests
          # 3.12 matches the production webapp venv and deploy.yml, and runs the
          # full subset.
          - python-version: "3.12"
            pytest-paths: tests web/tests

    steps:
      - name: Check out source paths
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            deploy
            scripts
            src
            tests
            web

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Both files feed the cache key, so a pin bump in either invalidates it.
          cache-dependency-path: |
            web/requirements.txt
            .github/ci-requirements.txt

      - name: Install dependencies
        # Deliberately NOT requirements.txt at the repo root: that pulls torch,
        # transformers, datasets and umap-learn, which are far too heavy for CI
        # and are only needed by the GPU extraction pipelines.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements.txt -r .github/ci-requirements.txt

      - name: Lint (syntax and undefined names)
        # ruff is version-pinned, so one run is enough; no need to repeat per leg.
        if: matrix.python-version == '3.12'
        run: ruff check --select E9,F63,F7,F82 src scripts tests web

      - name: Run tests
        # tests/       -- data-free smoke tests for src/ helpers
        # web/tests/   -- webapp suite, self-contained via tmp_path fixtures
        run: python -m pytest ${{ matrix.pytest-paths }} -q

  python:
    # Stable check name for the branch ruleset: matrix legs report as
    # "Python tests (3.10)" / "Python tests (3.12)", which a required context
    # named "Python tests" would never match. always() + an explicit result
    # assertion means this can never be reported as a passing "skipped" check.
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: python-matrix
    if: always()

    steps:
      - name: Assert every Python leg passed
        env:
          RESULT: ${{ needs.python-matrix.result }}
        run: |
          set -euo pipefail
          echo "python-matrix result: ${RESULT}"
          [ "${RESULT}" = "success" ] || exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: web/frontend

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Typecheck and build
        # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
        working-directory: web/frontend
        run: npm run build

      - name: Unit tests
        working-directory: web/frontend
        run: npm test
