name: Provision smoke account

# One-off, manually dispatched maintenance job (issue #98). It creates or
# rotates the account whose credentials live in LOCALLATIN_SMOKE_USERNAME /
# LOCALLATIN_SMOKE_PASSWORD, which deploy/deploy.sh uses to run the
# authenticated reviewer-pilot smoke checks after each production deploy.
#
# The deploy host is reachable only through the self-hosted runner, so the
# account cannot be created from anywhere else: registration alone yields a
# *pending* reviewer, and approving one needs a PI/admin session that does not
# exist yet.
#
# NOTHING SECRET IS PASSED THROUGH THIS WORKFLOW.
# `workflow_dispatch` inputs are stored in the run's metadata and are readable
# by anyone with repository access, so the input is a PBKDF2-SHA256 *hash*, not
# a password. Generate both locally:
#
#   python3 - <<'PY'
#   import hashlib, secrets, string
#   alphabet = string.ascii_letters + string.digits
#   password = ''.join(secrets.choice(alphabet) for _ in range(40))
#   salt = secrets.token_hex(16)
#   digest = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 200_000).hex()
#   print('password:', password)
#   print('hash:    ', f'pbkdf2_sha256$200000${salt}${digest}')
#   PY
#
# Then dispatch this workflow with the hash, and set the plaintext straight into
# the secret with `gh secret set LOCALLATIN_SMOKE_PASSWORD`. The plaintext never
# reaches GitHub except as an encrypted secret.

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Account login name (lowercased server-side)"
        required: true
        default: "locallatin-smoke"
      display_name:
        description: "Human-readable name shown on any rows this account writes"
        required: true
        default: "Deploy Smoke Check"
      password_hash:
        description: "pbkdf2_sha256$200000$<salt>$<digest> — NOT the password"
        required: true
      role:
        description: >-
          pi_admin is required by smoke_reviewer_pilot.py (it checks /api/stats,
          the CSV export, PDF packets and the approve/reject loop).
        required: true
        default: "pi_admin"
        type: choice
        options:
          - pi_admin
          - reviewer
      mode:
        description: "create a new account, or rotate an existing one's password"
        required: true
        default: "create"
        type: choice
        options:
          - create
          - rotate
      confirm:
        description: "Type PROVISION to confirm this writes to the production database"
        required: true

permissions:
  contents: read

# Never let this run alongside a deploy: deploy.sh restarts the service, and a
# restart mid-write would be a confusing failure to diagnose.
concurrency:
  group: production-deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  provision:
    name: Provision smoke account on the production host
    runs-on:
      - self-hosted
      - locallatin
      - production

    steps:
      - name: Refuse an unconfirmed dispatch
        if: inputs.confirm != 'PROVISION'
        run: |
          echo "confirm was '${{ inputs.confirm }}', expected 'PROVISION'." >&2
          echo "This job writes to the live reviewer database; type it exactly." >&2
          exit 1

      # Into the runner's own workspace, not DEPLOY_PATH: this job must not
      # move the deploy checkout's HEAD as a side effect, and the script it
      # needs may not have been pulled onto the host yet (the account has to
      # exist *before* the deploy whose smoke checks use it).
      - name: Check out the provisioning script
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: scripts/webapp

      - name: Provision the account
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          USERNAME: ${{ inputs.username }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          PASSWORD_HASH: ${{ inputs.password_hash }}
          ROLE: ${{ inputs.role }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/homes/ipro222/localLatin}"
          DB="${DEPLOY_PATH}/data/feedback.db"

          if [[ ! -f "${DB}" ]]; then
            echo "No database at ${DB}." >&2
            echo "Deploy and start the service once so its migrations create it." >&2
            exit 1
          fi

          # Back the database up before touching it. It holds reviewer feedback
          # that cannot be regenerated, and this is the only job that writes to
          # it outside the application itself.
          BACKUP="${DB}.pre-provision-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -p "${DB}" "${BACKUP}"
          echo "Backed up to ${BACKUP}"

          python3 scripts/webapp/provision_smoke_account.py \
            --db "${DB}" \
            --username "${USERNAME}" \
            --display-name "${DISPLAY_NAME}" \
            --password-hash "${PASSWORD_HASH}" \
            --role "${ROLE}" \
            --mode "${MODE}"
