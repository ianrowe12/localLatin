name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements.txt pytest httpx

      - name: Run backend tests
        run: python -m pytest web/tests

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: web/frontend
        run: npm test

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

  deploy:
    name: Deploy production
    runs-on:
      - self-hosted
      - locallatin
      - production
    needs: test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'

    steps:
      - name: Deploy locally on production runner
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          # Gitignored prediction CSVs and IG artifacts ride in as a GitHub
          # Release asset (scripts/webapp/make_data_release.sh builds it).
          # Unset => deploy.sh keeps whatever data is already on the host.
          DATA_RELEASE_TAG: ${{ vars.DATA_RELEASE_TAG }}
          # Optional: when both are set, deploy.sh runs the authenticated
          # reviewer-pilot smoke checks against the freshly restarted service.
          LOCALLATIN_SMOKE_USERNAME: ${{ secrets.LOCALLATIN_SMOKE_USERNAME }}
          LOCALLATIN_SMOKE_PASSWORD: ${{ secrets.LOCALLATIN_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/homes/ipro222/localLatin}"
          PUBLIC_BASE_PATH="${PUBLIC_BASE_PATH:-/}"

          cd "${DEPLOY_PATH}"
          git fetch origin main
          git checkout main
          # The deploy itself modifies tracked files on the host: npm rebuilds
          # web/static, and the data release installs newer bytes over the
          # tracked members of runs/active. A commit that touches one of those
          # files makes the fast-forward abort (#150). Restore ONLY the files
          # the incoming commits change, so the pull can land them; every other
          # locally modified file keeps its release or build bytes (restoring
          # all of runs/active would downgrade the 80 attribution NPZs to their
          # older committed arrays whenever the release cache is already
          # current). Untracked files, including the release payload and the
          # reviewer feedback DB, are never touched by git checkout.
          changed="$(git diff --name-only HEAD FETCH_HEAD -- runs/active web/static)"
          if [ -n "${changed}" ]; then
            printf '%s\n' "${changed}" | xargs -r -d '\n' git checkout --
          fi
          git status --short | head -20 || true
          git pull --ff-only origin main
          PUBLIC_BASE_PATH="${PUBLIC_BASE_PATH}" \
          DATA_RELEASE_TAG="${DATA_RELEASE_TAG:-}" \
            bash deploy/deploy.sh
