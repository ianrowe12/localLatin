# /etc/nginx/conf.d/locallatin.conf
# LocalLatin Scholar Review — reverse proxy + static frontend

upstream locallatin_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name ai.csr.uky.edu;

    # Uncomment if this nginx terminates SSL directly:
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/certs/ai.csr.uky.edu.crt;
    # ssl_certificate_key /etc/ssl/private/ai.csr.uky.edu.key;
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # --- API: proxy to uvicorn ---
    location /api/ {
        proxy_pass http://locallatin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Frontend: serve built static files ---
    root /u/irowerojas/localLatin/web/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Vite-fingerprinted assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    access_log /var/log/nginx/locallatin_access.log;
    error_log  /var/log/nginx/locallatin_error.log;
}
