[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locallatin-webapp"
version = "0.1.0"
description = "Scholar review interface for localLatin manuscript retrieval"
# 3.11+, not 3.10: `models.py` uses `enum.StrEnum`, which landed in 3.11, so the
# package cannot even be imported on 3.10 (CI's 3.10 leg therefore runs `tests/`
# only, and production runs 3.12 -- see deploy/REVIEWER_PILOT_READINESS.md).
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "eval_type_backport>=0.2.0",
]

[project.optional-dependencies]
tokenizers = ["transformers>=4.30.0"]
dev = ["ruff", "mypy"]

[tool.setuptools]
package-dir = {"web" = "."}
packages = ["web", "web.routers", "web.services"]
